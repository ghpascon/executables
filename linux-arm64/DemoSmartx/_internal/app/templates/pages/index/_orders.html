<!-- Orders Widget -->
<div
  class="bg-white rounded-lg shadow border border-gray-200 p-4 flex flex-col w-full mx-auto mb-2"
>
  <div class="mb-4 flex items-center justify-between">
    <h4 class="text-lg font-semibold text-gray-800">Orders Management</h4>
    <span class="text-sm text-gray-500"
      >Total: <span id="orders-count">0</span></span
    >
  </div>
  <div class="flex flex-row gap-4 items-center min-h-[60px]">
    <!-- Upload Block -->
    <div class="flex items-center gap-2 flex-1">
      <label for="orders-file" class="text-sm font-medium text-gray-700"
        >Upload (Excel/CSV):</label
      >
      <input
        type="file"
        id="orders-file"
        name="orders-file"
        accept=".csv,.xlsx"
        class="border rounded px-2 py-1 text-sm"
      />
      <button
        type="button"
        onclick="uploadOrders()"
        class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-sm"
      >
        Send
      </button>
    </div>
    <!-- Dropdown Block -->
    <div class="flex items-center gap-2 flex-1">
      <label for="orders-dropdown" class="text-sm font-medium text-gray-700"
        >Select Order:</label
      >
      <select
        id="orders-dropdown"
        onchange="setOrder(this.value)"
        class="border rounded px-2 py-1 text-sm min-w-[120px]"
      >
        <!-- Orders will be populated here -->
      </select>
    </div>
  </div>
</div>

<script src="/static/js/xlxs.js"></script>
<script>
  const addOrdersUrl = '{{ url_for("add_orders") }}';
  const getOrdersUrl = '{{ url_for("get_orders") }}';
  const getOrderUrl = '{{ url_for("get_order") }}';
  const setOrderUrl = '{{ url_for("set_order") }}';

  // Decodifica CSV simples: order,epc,description\n...
  function decodeOrdersFile(csvText) {
    // Detecta delimitador
    let delimiter = ",";
    if (
      csvText.includes(";") &&
      csvText.split(";").length > csvText.split(",").length
    ) {
      delimiter = ";";
    }
    const lines = csvText.split(/\r?\n/).filter(Boolean);
    if (lines.length < 2) return [];
    const headers = lines[0]
      .split(delimiter)
      .map((h) => h.trim().toLowerCase());
    console.log("[orders] Detected headers:", headers);
    const result = lines
      .slice(1)
      .map((line, idx) => {
        const cols = line.split(delimiter);
        if (cols.length !== headers.length) {
          console.warn(
            `[orders] Linha ${idx + 2} ignorada: número de colunas (${cols.length}) diferente dos headers (${headers.length})`,
            line,
          );
          return null;
        }
        const obj = {};
        headers.forEach((h, i) => (obj[h] = (cols[i] || "").trim()));
        console.log(`[orders] Linha ${idx + 2} objeto:`, obj);
        return obj;
      })
      .filter(
        (obj) =>
          obj &&
          typeof obj.order === "string" &&
          typeof obj.epc === "string" &&
          typeof obj.description === "string" &&
          obj.order &&
          obj.epc &&
          obj.description,
      );
    return result;
  }

  function sendOrdersList(ordersList, fileInput) {
    if (!ordersList.length) {
      showAlert("No valid orders found in file.", "warning");
      return;
    }
    console.log("[orders] Sending to", addOrdersUrl, ordersList);
    fetch(addOrdersUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(ordersList),
    })
      .then((resp) => resp.json())
      .then((data) => {
        let msg = data.message;
        console.log("[orders] Response:", msg);
        showAlert(msg, "info");
        fileInput.value = "";
        loadOrdersDropdown(true);
      })
      .catch((err) => {
        console.error("[orders] Fetch error:", err);
        showAlert("Failed to send orders: " + err, "error");
      });
  }

  function decodeXlsx(arrayBuffer) {
    const workbook = XLSX.read(arrayBuffer, { type: "array" });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: "", raw: false });
    console.log("[orders] XLSX rows:", rows);
    return rows
      .map((row) => {
        const obj = {};
        Object.keys(row).forEach(
          (k) => (obj[k.trim().toLowerCase()] = String(row[k]).trim()),
        );
        // Zero-pad EPC to 24 chars in case it was stored as a number in Excel
        if (obj.epc && /^\d+$/.test(obj.epc) && obj.epc.length < 24) {
          obj.epc = obj.epc.padStart(24, "0");
        }
        return obj;
      })
      .filter(
        (obj) =>
          obj.order &&
          obj.epc &&
          obj.description &&
          typeof obj.order === "string" &&
          typeof obj.epc === "string" &&
          typeof obj.description === "string",
      );
  }

  function uploadOrders() {
    const fileInput = document.getElementById("orders-file");
    const file = fileInput.files[0];
    if (!file) return showAlert("Select a file!", "warning");
    const isXlsx = file.name.toLowerCase().endsWith(".xlsx");
    const reader = new FileReader();
    if (isXlsx) {
      reader.onload = function (e) {
        const ordersList = decodeXlsx(new Uint8Array(e.target.result));
        console.log("[orders] Decoded XLSX ordersList:", ordersList);
        sendOrdersList(ordersList, fileInput);
      };
      reader.readAsArrayBuffer(file);
    } else {
      reader.onload = function (e) {
        const fileText = e.target.result;
        console.log("[orders] File text:", fileText);
        const ordersList = decodeOrdersFile(fileText);
        console.log("[orders] Decoded CSV ordersList:", ordersList);
        sendOrdersList(ordersList, fileInput);
      };
      reader.readAsText(file);
    }
  }

  function loadOrdersDropdown(autoSet = false) {
    Promise.all([
      fetch(getOrdersUrl).then((r) => r.json()),
      fetch(getOrderUrl).then((r) => r.json()),
    ]).then(([ordersData, activeData]) => {
      const orders = ordersData.orders || [];
      const activeOrder = activeData.order || null;
      const dropdown = document.getElementById("orders-dropdown");
      dropdown.innerHTML = "";
      orders.forEach((order) => {
        let val =
          typeof order.order === "string" ? order.order : String(order.order);
        const option = document.createElement("option");
        option.value = val;
        option.textContent = val;
        if (val === activeOrder) option.selected = true;
        dropdown.appendChild(option);
      });
      document.getElementById("orders-count").textContent = orders.length;
      if (autoSet && orders.length > 0) {
        const selectedVal = dropdown.value;
        setOrder(selectedVal);
      }
    });
  }

  function setOrder(orderName) {
    if (!orderName || typeof orderName !== "string") {
      showAlert("Invalid order selected.", "warning");
      return;
    }
    fetch(setOrderUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ order: orderName }),
    })
      .then((resp) => resp.json())
      .then((data) => {
        let msg = data && data.message ? data.message : JSON.stringify(data);
        showAlert(msg, "success");
      });
  }

  window.addEventListener("DOMContentLoaded", () => loadOrdersDropdown(true));
</script>
