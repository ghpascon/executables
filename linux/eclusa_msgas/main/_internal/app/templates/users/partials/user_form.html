<div class="card shadow">
  <div class="card-header bg-primary text-white">
    <h5 class="mb-0" id="form-title">👤 Adicionar Novo Usuário</h5>
  </div>
  <div class="card-body">
    <form id="user-form">
      <div class="row">
        <div class="col-md-6">
          <div class="mb-3">
            <label for="user_id" class="form-label">ID do Usuário *</label>
            <input
              type="text"
              class="form-control"
              id="user_id"
              name="user_id"
              required
              placeholder="Digite o ID do usuário"
            />
          </div>
        </div>
        <div class="col-md-6">
          <div class="mb-3">
            <label for="card_id" class="form-label">
              ID do Cartão *
              <button
                type="button"
                class="btn btn-sm btn-outline-secondary ms-2"
                onclick="loadCurrentCard()"
                title="Usar cartão atual"
              >
                🔄 Atual
              </button>
            </label>
            <input
              type="text"
              class="form-control"
              id="card_id"
              name="card_id"
              required
              placeholder="Digite o ID do cartão"
            />
          </div>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success" id="submit-btn">
          ➕ Adicionar Usuário
        </button>
        <button
          type="button"
          class="btn btn-secondary"
          onclick="resetForm()"
          id="cancel-btn"
          style="display: none"
        >
          ❌ Cancelar
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  let isEditMode = false;

  // Initialize when page loads
  document.addEventListener("DOMContentLoaded", function () {
    loadCurrentCard();
  });

  // Load current card ID
  async function loadCurrentCard() {
    try {
      const response = await fetch('{{ url_for("get_card_id") }}');
      const data = await response.json();
      if (response.ok && data.card_id) {
        document.getElementById("card_id").value = data.card_id;
      }
    } catch (error) {
      console.error("Erro ao carregar card ID:", error);
    }
  }

  // Form submission
  document
    .getElementById("user-form")
    .addEventListener("submit", async function (e) {
      e.preventDefault();

      // Temporarily enable user_id field to include it in FormData
      const userIdField = document.getElementById("user_id");
      const wasDisabled = userIdField.disabled;
      if (wasDisabled) {
        userIdField.disabled = false;
      }

      const formData = new FormData(this);
      const userData = {
        user_id: formData.get("user_id"),
        card_id: formData.get("card_id"),
      };

      // Restore disabled state if it was disabled
      if (wasDisabled) {
        userIdField.disabled = true;
      }

      try {
        let response;

        if (isEditMode) {
          const url = `{{ url_for("update_user_card") }}?${new URLSearchParams(
            userData
          )}`;
          response = await fetch(url, { method: "PUT" });
        } else {
          const url = `{{ url_for("create_user") }}?${new URLSearchParams(
            userData
          )}`;
          response = await fetch(url, { method: "POST" });
        }

        if (response.ok) {
          resetForm();
          loadUsers(); // Reload user list
        }
      } catch (error) {
        console.error("Erro:", error);
      }
    });

  // Edit user function (called from user list)
  function editUser(userId, cardId) {
    isEditMode = true;

    document.getElementById("user_id").value = userId;
    document.getElementById("card_id").value = cardId;
    document.getElementById("user_id").disabled = true;

    document.getElementById("form-title").textContent = "✏️ Editar Usuário";
    document.getElementById("submit-btn").innerHTML = "💾 Salvar Alterações";
    document.getElementById("submit-btn").className = "btn btn-warning";
    document.getElementById("cancel-btn").style.display = "inline-block";

    document.querySelector(".card").scrollIntoView({ behavior: "smooth" });
  }

  // Reset form
  function resetForm() {
    document.getElementById("user-form").reset();
    document.getElementById("user_id").disabled = false;
    isEditMode = false;

    document.getElementById("form-title").textContent =
      "👤 Adicionar Novo Usuário";
    document.getElementById("submit-btn").innerHTML = "➕ Adicionar Usuário";
    document.getElementById("submit-btn").className = "btn btn-success";
    document.getElementById("cancel-btn").style.display = "none";

    loadCurrentCard(); // Reload current card
  }
</script>
