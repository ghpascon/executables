<!-- TAGS -->
<div
    id="tags-container"
    class="shadow"
    style="
        margin-top:5px;
        height:60vh;
        overflow-y:auto;
        border:3px solid black;
        border-radius:6px;
        background:#f4f4f4;
        padding:12px;
    ">
</div>

<script>

function att_table(){
    fetchTags();
}

att_table();
setInterval(att_table,500);

let tagsData=[];
let isFetchingTags=false;

function formatTimestamp(value,key){

    if(key==="timestamp"){

        const d=new Date(value);

        if(!isNaN(d)){

            return d.toLocaleTimeString();
        }
    }

    return value;
}

function createTagCard(tag){

    const card=document.createElement("div");

    card.className="card shadow-sm mb-3";

    card.style.borderRadius="10px";

    card.style.transition=".2s";

    //----------------------------------------------------
    // INFO AINDA NÃO CARREGOU
    //----------------------------------------------------

    if(!tag.info){

        card.style.background="#ececec";

        card.innerHTML=`
            <div class="card-body d-flex justify-content-center align-items-center"
                 style="height:140px">

                <div class="spinner-border text-secondary me-3"></div>

                <div>
                    <div style="font-weight:bold">
                        Carregando...
                    </div>

                    <small class="text-muted">
                        Obtendo informações da tag
                    </small>
                </div>

            </div>
        `;

        return card;
    }

    //----------------------------------------------------
    // COR DO CARD
    //----------------------------------------------------

    const apto=tag.info.apto===true;

    card.style.background=apto ? "#edfdf3" : "#fff0f0";

    card.style.borderLeft=apto
        ? "8px solid #198754"
        : "8px solid #dc3545";

    //----------------------------------------------------
    // CAMPOS DINÂMICOS
    //----------------------------------------------------

    let fields="";

    Object.entries(tag.info).forEach(([key,value])=>{

        if(key==="descricao")
            return;

        if(typeof value==="string")
            value=value.trim();

        if(value==="" || value===null || value===undefined)
            value="-";

        fields+=`
            <div class="col-md-6 mb-2">

                <div
                    style="
                        font-size:.72rem;
                        color:#666;
                        text-transform:uppercase;
                        font-weight:bold;
                    ">

                    ${key}

                </div>

                <div
                    style="
                        font-size:.9rem;
                        word-break:break-word;
                    ">

                    ${value}

                </div>

            </div>
        `;
    });

    //----------------------------------------------------
    // DESCRIÇÃO
    //----------------------------------------------------

    const descricao=tag.info.descricao || "Sem descrição";


    //----------------------------------------------------

    card.innerHTML=`

        <div class="card-body">

            <div
                class="d-flex justify-content-between align-items-start mb-3">

                <div
                    style="
                        font-size:1.05rem;
                        font-weight:bold;
                        line-height:1.3;
                    ">

                    ${descricao}

                </div>

            </div>

            <div class="row">

                ${fields}

            </div>

        </div>

    `;

    return card;
}

function renderTags(data){

    const container=document.getElementById("tags-container");

    const scroll=container.scrollTop;

    container.innerHTML="";

    if(data.length===0){

        container.innerHTML=`
            <div
                class="alert alert-secondary text-center">

                Waiting for tags...

            </div>
        `;

        return;
    }

    const row=document.createElement("div");

    row.className="row";

    data.forEach(tag=>{

        const col=document.createElement("div");

        col.className="col-xl-4 col-lg-6 col-md-12";

        col.appendChild(createTagCard(tag));

        row.appendChild(col);

    });

    container.appendChild(row);

    container.scrollTop=scroll;

}

async function fetchTags(){

    if(isFetchingTags)
        return;

    isFetchingTags=true;

    try{

        const response=await fetch("{{ url_for('get_tags') }}");

        const data=await response.json();

        tagsData=Array.isArray(data) ? data : [];

        renderTags(tagsData);

    }
    catch(err){

        console.error(err);

    }
    finally{

        isFetchingTags=false;

    }

}

</script>
