   <script>
        // Clone navbar links into mobile dropdown
        document.addEventListener('DOMContentLoaded', function () {
          function bindTagReportHandlers(scope) {
            scope.querySelectorAll('a[data-tag-report="true"]').forEach(function (link) {
              if (link.dataset.tagReportBound === 'true') {
                return;
              }

              link.dataset.tagReportBound = 'true';
              link.addEventListener('click', async function (event) {
                event.preventDefault();

                const endpoint = link.getAttribute('href');
                if (!endpoint) {
                  return;
                }

                try {
                  const response = await fetch(endpoint, {
                    headers: { 'Accept': 'application/json' }
                  });

                  if (!response.ok) {
                    throw new Error('Failed to load report');
                  }

                  const payload = await response.json();
                  const rows = Array.isArray(payload.data) ? payload.data : [];

                  if (rows.length === 0) {
                    alert('No tags found to export.');
                    return;
                  }

                  const columns = Object.keys(rows[0]);
                  const escapeCsvValue = function (value) {
                    const text = String(value ?? '');
                    return '"' + text.replace(/"/g, '""') + '"';
                  };

                  const csvLines = [columns.join(',')];
                  rows.forEach(function (row) {
                    const line = columns.map(function (column) {
                      return escapeCsvValue(row[column]);
                    }).join(',');
                    csvLines.push(line);
                  });

                  const csvContent = csvLines.join('\n');
                  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                  const downloadUrl = URL.createObjectURL(blob);
                  const fileName = 'tags_report.csv';

                  const downloadLink = document.createElement('a');
                  downloadLink.href = downloadUrl;
                  downloadLink.download = fileName;
                  document.body.appendChild(downloadLink);
                  downloadLink.click();
                  downloadLink.remove();
                  URL.revokeObjectURL(downloadUrl);
                } catch (error) {
                  console.error('Tag report export failed:', error);
                  alert('Could not export tag report.');
                }
              });
            });
          }

          const desktopNav = document.querySelector('nav.hidden.md\\:flex');
          const mobileMenu = document.getElementById('mobile-menu-dropdown');
          const mobileLoggedUser = document.getElementById('mobile-logged-user');
          const loggedUserSpan = document.getElementById('loggedUser');
          if (desktopNav && mobileMenu) {
            // Remove any previous links
            mobileMenu.innerHTML = '';
            // Clone anchors and forms (logout is a form) into mobile menu
            desktopNav.querySelectorAll('a, form').forEach(function (el) {
              if (el.tagName.toLowerCase() === 'a') {
                const link = document.createElement('a');
                link.href = el.href;
                link.textContent = el.textContent;
                if (el.dataset.tagReport === 'true') {
                  link.dataset.tagReport = 'true';
                }
                link.className = 'block px-4 py-2 text-gray-700 hover:bg-gray-100';
                mobileMenu.appendChild(link);
              } else if (el.tagName.toLowerCase() === 'form') {
                try {
                  const action = el.getAttribute('action') || '';
                  const method = el.getAttribute('method') || 'post';
                  const form = document.createElement('form');
                  form.method = method;
                  form.action = action;
                  form.className = 'px-4 py-2';
                  const btn = el.querySelector('button');
                  const btnText = btn ? (btn.textContent || 'Logout') : 'Logout';
                  const mobileBtn = document.createElement('button');
                  mobileBtn.type = 'submit';
                  mobileBtn.textContent = btnText;
                  mobileBtn.className = 'w-full text-left px-4 py-2 bg-red-600 text-white hover:bg-red-700 rounded-md';
                  form.appendChild(mobileBtn);
                  mobileMenu.appendChild(form);
                } catch (err) {
                  // ignore and skip
                }
              }
            });
            // Fetch logged user and display
            try {
              fetch("{{ url_for('get_user') }}", { headers: { 'Accept': 'application/json' } })
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                  const user = data && data.user ? data.user : null;
                  if (user) {
                    if (loggedUserSpan) loggedUserSpan.textContent = user;
                    if (mobileLoggedUser) { mobileLoggedUser.textContent = user; mobileLoggedUser.classList.remove('hidden'); }
                  }
                })
                .catch(() => { /* ignore */ });
            } catch (e) {
              // ignore
            }
          }

          if (typeof bindTagReportHandlers === 'function') {
            bindTagReportHandlers(document);
            if (mobileMenu) bindTagReportHandlers(mobileMenu);
          }
        });
      </script>
