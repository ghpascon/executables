<section class="mb-4 rounded-lg border border-blue-100 bg-white p-5 shadow-sm" x-data="{
	todayCount: null,
	async loadTodayCount() {
		try {
			const response = await fetch('{{ url_for('get_today_count') }}', { headers: { Accept: 'application/json' } });
			if (!response.ok) throw new Error('Falha ao carregar');
			const data = await response.json();
			this.todayCount = data.today_count;
		} catch (error) {
			this.todayCount = null;
		}
	}
}" x-init="loadTodayCount(); setInterval(() => loadTodayCount(), 60000)">
	<div class="mb-3 flex items-center gap-2">
		<h1 class="text-sm font-semibold text-slate-700">Tags</h1>
	</div>
	<p class="text-4xl font-bold tracking-tight text-blue-700" x-text="todayCount ?? '—'" aria-live="polite">—</p>
</section>
