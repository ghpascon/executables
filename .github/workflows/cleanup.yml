name: Cleanup inactive folders

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cleanup
        shell: bash
        run: |
          set -Eeuo pipefail

          DAYS=30
          NOW=$(date +%s)

          echo "Removendo arquivos de diretórios inativos há mais de ${DAYS} dias..."

          find . \
            -path "./.git" -prune -o \
            -type d -print | while read -r dir; do

            # Ignora diretório raiz
            [[ "$dir" == "." ]] && continue

            # Último commit que alterou algo dentro da pasta
            LAST_COMMIT=$(git log -1 --format=%ct -- "$dir" 2>/dev/null || true)

            # Diretórios sem histórico são ignorados
            [[ -z "$LAST_COMMIT" ]] && continue

            AGE=$(( (NOW - LAST_COMMIT) / 86400 ))

            if (( AGE > DAYS )); then
              echo "[$AGE dias] Limpando: $dir"

              find "$dir" \
                -type f \
                ! -name "README.md" \
                -delete
            fi
          done

          echo
          echo "Removendo diretórios vazios..."

          # Repete até não existirem mais diretórios vazios
          while true; do
            COUNT=$(find . \
              -path "./.git" -prune -o \
              -type d -empty -print | wc -l)

            [[ "$COUNT" -eq 0 ]] && break

            find . \
              -path "./.git" -prune -o \
              -type d -empty \
              -delete
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
            exit 0
          fi

          git commit -m "chore: cleanup inactive folders"
          git push
