name: Cleanup inactive folders

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cleanup inactive folders
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          DAYS=30
          CUTOFF=$(date -u -d "$DAYS days ago" '+%Y-%m-%dT%H:%M:%SZ')

          echo "========================================"
          echo "Cleanup de diretórios inativos"
          echo "Data limite: $CUTOFF"
          echo "========================================"

          # Arquivo temporário contendo os diretórios que tiveram
          # alguma alteração nos últimos DAYS dias.
          ACTIVE_DIRS=$(mktemp)

          echo "Buscando atividade recente..."

          # Obtém commits recentes através da API do GitHub.
          gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/commits?since=${CUTOFF}&per_page=100" \
            --jq '.[].sha' |
          while read -r SHA; do

            [[ -z "$SHA" ]] && continue

            # Obtém os arquivos alterados naquele commit.
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/commits/$SHA" \
              --jq '.files[].filename' 2>/dev/null |
            while read -r FILE; do

              [[ -z "$FILE" ]] && continue

              # Ignora .github
              [[ "$FILE" == .github/* ]] && continue

              # Registra todos os diretórios pai do arquivo.
              DIR=$(dirname "$FILE")

              while [[ "$DIR" != "." && "$DIR" != "/" ]]; do
                echo "$DIR" >> "$ACTIVE_DIRS"
                DIR=$(dirname "$DIR")
              done

            done

          done

          # Remove duplicados.
          sort -u "$ACTIVE_DIRS" -o "$ACTIVE_DIRS"

          echo
          echo "Diretórios ativos recentemente:"
          cat "$ACTIVE_DIRS" || true
          echo

          echo "Analisando diretórios..."

          # Percorre somente diretórios existentes no working tree.
          find . \
            -type d \
            ! -path "./.git" \
            ! -path "./.git/*" \
            ! -path "./.github" \
            ! -path "./.github/*" |
          while IFS= read -r DIR; do

            [[ "$DIR" == "." ]] && continue

            # Remove ./ para comparar com os caminhos do GitHub.
            REL_DIR="${DIR#./}"

            # Verifica se o diretório teve alguma atividade recente.
            if grep -Fxq "$REL_DIR" "$ACTIVE_DIRS"; then
              echo "Mantendo: $DIR"
              continue
            fi

            echo "Inativo: $DIR"

            # Remove arquivos, preservando README.md.
            find "$DIR" \
              -type f \
              ! -name "README.md" \
              -delete

          done

          rm -f "$ACTIVE_DIRS"

      - name: Remove empty directories
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -depth \
            -type d \
            -empty \
            ! -path "./.git" \
            ! -path "./.git/*" \
            ! -path "./.github" \
            ! -path "./.github/*" \
            -delete

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração"
            exit 0
          fi

          git commit -m "cleanup: remove inactive files/folders"
          git push
