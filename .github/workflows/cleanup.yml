```yaml
name: Cleanup inactive folders

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cleanup old files (keep README.md)
        shell: bash
        run: |
          set -euo pipefail

          DAYS=30
          NOW=$(date +%s)

          echo "Analisando diretórios..."

          # Percorre diretórios, ignorando .git e .github
          while IFS= read -r dir; do
            [[ "$dir" == "." ]] && continue
            [[ "$dir" == "./.git" || "$dir" == ./.git/* ]] && continue
            [[ "$dir" == "./.github" || "$dir" == ./.github/* ]] && continue

            LAST_COMMIT=$(git log -1 --format=%ct -- "$dir" 2>/dev/null || true)
            [[ -z "$LAST_COMMIT" ]] && continue

            AGE=$(( (NOW - LAST_COMMIT) / 86400 ))

            if (( AGE > DAYS )); then
              echo "Limpando $dir ($AGE dias)"

              find "$dir" \
                -type f \
                ! -name "README.md" \
                -delete
            fi

          done < <(
            find . \
              -type d \
              ! -path "./.git" \
              ! -path "./.git/*" \
              ! -path "./.github" \
              ! -path "./.github/*"
          )

      - name: Remove empty directories
        shell: bash
        run: |
          set -euo pipefail

          # Remove diretórios vazios, exceto .git e .github
          find . \
            -depth \
            -type d \
            -empty \
            ! -path "./.git" \
            ! -path "./.git/*" \
            ! -path "./.github" \
            ! -path "./.github/*" \
            -delete

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração"
            exit 0
          fi

          git commit -m "cleanup: remove inactive files/folders"
          git push
```
